site_name: WhisperSubs
site_url: https://geiserx.github.io/whisper-subs/
site_description: Local AI subtitle generation for Jellyfin. Audio never leaves your server unless you say so.
repo_url: https://github.com/GeiserX/whisper-subs
repo_name: GeiserX/whisper-subs
edit_uri: edit/main/docs/

# A warning is a broken link, a missing page or a page nobody can reach. All of
# them fail the build, locally and in CI, so nobody has to remember --strict.
strict: true

theme:
  name: material
  language: en
  logo: images/logo.svg
  favicon: images/icon.svg
  palette:
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - content.code.copy
    - content.action.edit
    - search.highlight
    - search.suggest
    - toc.follow
  icon:
    repo: fontawesome/brands/github

# MkDocs reports most link problems as `info`, which --strict ignores. Every
# line here promotes one of them to a warning so the build fails on it:
#   nav.omitted_files   a Markdown file under docs/ that is in no nav entry and
#                       not in exclude_docs (a page nobody can reach, published
#                       at a public URL anyway);
#   nav.not_found       a nav entry whose file does not exist;
#   links.not_found     a relative link to a page or file that does not exist;
#   links.anchors       a link to a heading that does not exist;
#   links.absolute_links  a link written as /path/ (breaks under the
#                       /whisper-subs/ prefix of the site);
#   links.unrecognized_links  a relative link that leaves docs/ (../README.md).
#                       Repo files are linked by absolute GitHub URL instead.
validation:
  nav:
    omitted_files: warn
    not_found: warn
    absolute_links: warn
  links:
    not_found: warn
    anchors: warn
    absolute_links: warn
    unrecognized_links: warn

plugins:
  - search
  # The setup guide lives at docs/docs/setup.md so that its URL stays
  # /docs/setup/: that path is compiled into every shipped plugin DLL
  # (Web/configPage.html) and the README links it. /setup/, the name the other
  # nine pages would suggest, forwards there.
  - redirects:
      redirect_maps:
        setup.md: docs/setup.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path:
        - .
        - docs
      check_paths: true
  - pymdownx.mark
  # attr_list also keeps the explicit heading ids the pages carry
  # (`## Quick start {#quick-start}`), so every anchor the old site had still resolves.
  - attr_list
  - md_in_html
  # Renders :material-xxx: shortcodes as icons. The grid cards on index.md use
  # them; without this they print as literal text.
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/GeiserX/whisper-subs
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/r/drumsergio/whisper-subs-worker

extra_css:
  - stylesheets/theme.css

# Files under docs/ that are not pages. MkDocs publishes every Markdown file in
# docs/ whether or not it is in the nav, so anything that is not a page must be
# listed here. A name with a capital letter is a repo-facing note; design/,
# research/ and notes/ hold material read on GitHub (docs/design/ has the
# CrispASR translation design, which links repo files relatively).
exclude_docs: |
  [A-Z]*.md
  design/
  research/
  notes/
  requirements-docs.txt

# The groups are the ones site/sidebars.ts had. The nav title equals each page's H1.
nav:
  - Home: index.md
  - Getting started:
      - Setup guide: docs/setup.md
      - Choosing a whisper binary variant: choosing-a-variant.md
      - Platform-specific installs: install-topologies.md
  - Running it:
      - Settings reference: configuration.md
      - Remote workers and hosted providers: remote-workers.md
  - Help:
      - Diagnostics and the status endpoint: diagnostics.md
      - Limitations: limitations.md
  - Reference:
      - Features in detail: features.md
      - API and internals: api-and-internals.md
