name: Pages

# The SOLE owner of GitHub Pages for this repository.
#
# Pages publishes one artifact as the ENTIRE site: whatever is not in the
# artifact is deleted. The Jellyfin plugin catalog (manifest.json) and the
# documentation site therefore have to ship together, from here, or one
# would silently delete the other.
on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'manifest.json'
      - '.github/workflows/pages.yml'
  # A push made by the release workflow's GITHUB_TOKEN does NOT create a
  # workflow run, so the manifest commit can never trigger the push event
  # above. Fire on the release run completing instead.
  workflow_run:
    workflows: ['Build and Release']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Shared with build-release.yml so a docs push and a release can never
# interleave and publish half a site. Never cancel: cancelling between
# "release created" and "catalog published" strands the catalog.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    # workflow_run fires on completion regardless of outcome. Only follow a
    # release that actually succeeded; a failed one has no new catalog.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install docs dependencies
        id: deps
        continue-on-error: true
        working-directory: site
        run: npm ci

      - name: Build documentation
        id: docs
        if: steps.deps.outcome == 'success'
        continue-on-error: true
        working-directory: site
        run: npm run build

      # The release workflow attaches manifest.json to every release, so the
      # newest release carries the authoritative catalog. There is no read of
      # the live site here: that would be circular, since this job is what
      # publishes it.
      - name: Resolve the catalog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p _catalog
          cp manifest.json _catalog/committed.json
          if gh release download --repo "$GITHUB_REPOSITORY" \
               --pattern manifest.json --dir _catalog --clobber 2>/dev/null; then
            mv _catalog/manifest.json _catalog/released.json
          else
            echo "no release carries a catalog yet; using the committed copy"
            cp _catalog/committed.json _catalog/released.json
          fi
          # Never publish an older catalog than the one in git. Whichever names
          # the higher newest-version wins.
          RV=$(jq -er '.[0].versions[0].version' _catalog/released.json)
          CV=$(jq -er '.[0].versions[0].version' _catalog/committed.json)
          WINNER=$(printf '%s\n%s\n' "$RV" "$CV" | sort -V | tail -1)
          if [ "$WINNER" = "$RV" ]; then
            cp _catalog/released.json _catalog/manifest.json
            echo "catalog: release asset (newest=$RV, committed=$CV)"
          else
            cp _catalog/committed.json _catalog/manifest.json
            echo "catalog: committed copy (newest=$CV, release=$RV)"
          fi

      # The catalog must publish even when the docs are broken. Missing docs
      # is the status quo; a missing catalog breaks every installed plugin.
      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site
          if [ "${{ steps.docs.outcome }}" = "success" ]; then
            cp -r site/build/. _site/
            echo "docs: included"
          else
            echo "docs: BUILD FAILED - publishing the catalog only"
          fi
          cp _catalog/manifest.json _site/manifest.json

      - name: Gate - the catalog must be present and valid
        run: |
          set -euo pipefail
          test -f _site/manifest.json
          jq -e 'type == "array"' _site/manifest.json > /dev/null
          jq -e '.[0].guid == "97124bd9-c8cd-4a53-a213-e593aa3fef52"' _site/manifest.json > /dev/null
          V=$(jq -er '.[0].versions[0].version' _site/manifest.json)
          echo "gate ok: publishing catalog newest=$V"

      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5

      # Reported LAST, on purpose. Placed before the deploy, a non-zero exit
      # here would skip the upload and deploy steps (they default to
      # if: success()), so a broken docs build would take the catalog offline -
      # the exact outcome the fail-soft design exists to prevent.
      - name: Report the documentation build failure
        if: steps.deps.outcome != 'success' || steps.docs.outcome != 'success'
        run: |
          echo "::error::The documentation build failed. The catalog was published without it."
          exit 1
