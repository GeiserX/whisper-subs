name: CI

on:
  workflow_dispatch:
  push:
    branches: [main, v4-dev]
  pull_request:
    branches: [main, v4-dev]

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  # The admin UI ships as an embedded resource, so nothing in the .NET build ever parses it. One stray
  # character makes the browser skip the WHOLE inline <script> — every panel stays on its static markup
  # and every button loses its listener, with nothing logged server-side (issue #149, shipped 4.5.0.2).
  web-js:
    name: Browser JS parses
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Parse-check shipped browser JavaScript
        run: node scripts/check-web-js.mjs

  # The documentation site is built and published only by pages.yml, which runs on push and
  # workflow_run — never on a pull request. So a site dependency bump used to reach main with six
  # green checks and no one having compiled it; the failure surfaced afterwards, as a red Pages run
  # on main. pages.yml fails soft, so the plugin catalog survives that, but the docs silently stop
  # updating. Build it here instead, where the PR can still be stopped.
  site:
    name: Docs site builds
    runs-on: ubuntu-latest
    # Least privilege: this job only reads the tree and runs a static build. Checkout leaves its
    # token in .git/config by default, which npm ci and every lifecycle script it runs would inherit.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install
        working-directory: site
        run: npm ci

      - name: Build
        working-directory: site
        run: npm run build

      # /docs/setup/ is compiled into every shipped plugin DLL, so it has to exist in the output
      # whatever the docs structure does. A generator emitting its own manifest.json at the site root
      # would overwrite the Jellyfin plugin catalog that pages.yml publishes alongside these files:
      # valid JSON, wrong contents, HTTP 200, invisible to any status-code check.
      - name: Gate - required routes present, no catalog collision
        working-directory: site
        run: |
          set -euo pipefail
          test -f build/index.html
          test -f build/docs/setup/index.html
          if [ -e build/manifest.json ]; then
            echo "::error::The site build emitted manifest.json, which would overwrite the plugin catalog."
            exit 1
          fi
          echo "routes ok: $(find build -name index.html | wc -l | tr -d ' ') pages, docs/setup present"

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '9.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Restore dependencies
        run: dotnet restore WhisperSubs.Tests/WhisperSubs.Tests.csproj

      - name: Build
        run: >
          dotnet build WhisperSubs.Tests/WhisperSubs.Tests.csproj
          --configuration Release --no-restore

      - name: Test with coverage
        run: >
          dotnet test WhisperSubs.Tests/WhisperSubs.Tests.csproj
          --configuration Release --no-build --verbosity normal
          --collect:"XPlat Code Coverage"
          -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=cobertura

      - name: Require coverage output
        run: test -n "$(compgen -G 'WhisperSubs.Tests/TestResults/*/coverage.cobertura.xml')"

      - name: Upload coverage to Codecov
        if: >-
          always() &&
          (github.event_name != 'pull_request' ||
           github.event.pull_request.head.repo.fork == false)
        uses: codecov/codecov-action@v7
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: '**/TestResults/**/coverage.cobertura.xml'
          fail_ci_if_error: true

      - name: Upload coverage to Codecov (fork)
        if: >-
          always() &&
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.fork == true
        uses: codecov/codecov-action@v7
        with:
          files: '**/TestResults/**/coverage.cobertura.xml'
          fail_ci_if_error: true
