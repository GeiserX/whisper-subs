version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - automated
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      nuget_security:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      - dependency-name: Jellyfin.Controller
      - dependency-name: Jellyfin.Model
  - package-ecosystem: pip
    directory: /docs
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - automated
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      pip_security:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      # Material 9.7 is its last feature line and the next major needs MkDocs 2; take that on purpose.
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      # mkdocs-redirects 1.2.3 depends on properdocs, a MkDocs fork, and caps mkdocs<=1.6.1. Stay on 1.2.2.
      - dependency-name: mkdocs-redirects
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels:
      - ci
      - automated
    groups:
      github-actions:
        patterns:
          - '*'
      github_actions_security:
        applies-to: security-updates
        patterns:
          - '*'
