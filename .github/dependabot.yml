version: 2
updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - automated
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      nuget_security:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
      - dependency-name: Jellyfin.Controller
      - dependency-name: Jellyfin.Model
  - package-ecosystem: npm
    directory: /site
    schedule:
      interval: weekly
      day: monday
    commit-message:
      prefix: deps
    labels:
      - dependencies
      - automated
    groups:
      minor-and-patch:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
      npm_security:
        applies-to: security-updates
        patterns:
          - '*'
    ignore:
      # Docusaurus majors change config and theme APIs, so take those
      # deliberately. Scoped to Docusaurus rather than '*': a blanket major
      # ignore also silences security fixes that need a major bump, which is
      # how Action majors drifted unnoticed elsewhere.
      - dependency-name: '@docusaurus/*'
        update-types:
          - version-update:semver-major
      # TypeScript 7 removed the `baseUrl` compiler option, and
      # @docusaurus/tsconfig still sets it, so `npm run typecheck` fails on
      # the inherited value no matter what this repo does. Drop this entry
      # once @docusaurus/tsconfig stops shipping baseUrl.
      - dependency-name: typescript
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: ci
    labels:
      - ci
      - automated
    groups:
      github-actions:
        patterns:
          - '*'
      github_actions_security:
        applies-to: security-updates
        patterns:
          - '*'
