# whisper-subs worker -- Intel / AMD iGPU (Vulkan) example.
#
# 1. Start it:            docker compose -f docker-compose.example.yml up -d
#    (first boot downloads the model into the `whisper-models` volume; be patient.)
# 2. Point the plugin at it: Dashboard > Plugins > WhisperSubs > Workers ->
#    add a worker with Endpoint http://<this-host>:9010  (NO /v1 suffix),
#    the API key below if set, and MaxConcurrency = 1 (one iGPU ~= one stream).
#
# NB: never use the :latest tag -- pin a semver image tag.

services:
  whisper-subs-worker:
    image: drumsergio/whisper-subs-worker:0.1.4
    # To build locally instead of pulling, comment out `image:` above and uncomment:
    # build:
    #   context: .
    #   dockerfile: Dockerfile
    container_name: whisper-subs-worker
    restart: unless-stopped

    ports:
      # host:container -- the plugin connects to http://<host>:9010
      - "9010:8080"

    environment:
      # Served whisper model. whisper-server serves exactly ONE model; the plugin's
      # per-worker "Model" field is sent but ignored by this backend -- set it HERE.
      WHISPER_MODEL: large-v3-turbo-q5_0
      # Optional Bearer token. If set, configure the SAME key on the plugin worker.
      # API_KEY: "change-me-to-a-long-random-string"
      # Accept non-WAV audio from other OpenAI clients (needs an image built with
      # --build-arg INSTALL_FFMPEG=true). The plugin always sends 16kHz WAV, so off.
      # CONVERT: "false"
      # WHISPER_THREADS: "4"           # CPU threads for whisper.cpp. Set to your CPU
      #                                # core count on CPU-only workers for best speed.
      # WHISPER_MAX_LEN: "47"          # Max characters per subtitle cue (-ml), paired with
      #   -sow so a cap never breaks mid-word. Whisper caps nothing by default, so a stretch it
      #   fails to punctuate arrives as one enormous run-on cue. Empty/0 = unlimited (default).
      #   This is the worker-side twin of the plugin's "Maximum subtitle line length" setting,
      #   which only applies to the Jellyfin host's own whisper-cli.
      # WHISPER_SPLIT_ON_WORD: "true"  # Pair -sow with WHISPER_MAX_LEN (default true).
      # WHISPER_EXTRA_ARGS: "--no-flash-attn"   # extra whisper-server flags. Flash
      #   attention is already ON by default in whisper.cpp v1.8.4, so passing
      #   --flash-attn is a no-op; use --no-flash-attn only if a buggy Vulkan driver
      #   miscomputes with it.
      # WHISPER_MAX_INFLIGHT: "1"      # Max concurrent inferences forwarded upstream.
      #   whisper-server runs ONE inference at a time, so the default 1 serialises requests
      #   here — a second request waits on a cancellable queue instead of piling into the
      #   backend's accept queue behind a long job (which would silently blow short probes'
      #   deadlines). Raise ONLY if you run multiple backend instances; 0 disables the cap.
      # WHISPER_BACKEND_TIMEOUT: "3600"   # FLOOR (seconds) of the per-request wedge backstop. The
      #   actual backstop scales with audio length (audioSeconds x WHISPER_BACKEND_TIMEOUT_FACTOR,
      #   capped at WHISPER_BACKEND_TIMEOUT_CAP=86400) so a long film is never guillotined; a request
      #   that still exceeds it is treated as a wedged whisper-server and the backend self-heals. The
      #   factor (default 12) is well above the plugin's own 6x deadline, so this only fires if the
      #   plugin never drops. Raise the floor/factor only for exotic hardware or huge models.
      # Pin a specific Vulkan ICD only if auto-discovery picks the wrong GPU. The
      # exact filename varies (Debian/Mesa often uses the *.x86_64.json form); leave
      # UNSET to auto-discover. Verify with: docker exec ... ls /usr/share/vulkan/icd.d/
      # VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/intel_icd.x86_64.json   # Intel
      # VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/radeon_icd.x86_64.json  # AMD

    devices:
      # Intel/AMD iGPU passthrough.
      - /dev/dri:/dev/dri

    group_add:
      # REQUIRED ONE-TIME STEP for GPU acceleration: the non-root container user must be
      # in the host group that OWNS /dev/dri/renderD128. Set the number below to YOUR
      # host's render GID -- find it with:
      #   getent group render | cut -d: -f3      (commonly 993, 104, or 44)
      # Use the NUMERIC host GID, not the name "render": the name resolves inside the
      # image but its GID would not match the host's device owner, so the GPU open would
      # silently fail and whisper falls back to (very slow) CPU. 993 is only a common
      # default -- verify yours.
      - "993"

    volumes:
      # Model cache -- survives restarts so the model is downloaded only once.
      - whisper-models:/models

    # Container hardening. The image already runs non-root (uid 1000); these drop the
    # rest of the ambient privilege so an exposed/compromised worker is contained.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Read-only root filesystem: only the model cache (/models volume) and a small tmpfs
    # need to be writable. Comment this pair out if a model download ever needs to write
    # elsewhere on first run.
    read_only: true
    tmpfs:
      - /tmp

    # Cap RAM. large-v3-turbo-q5_0 is light; raise to ~10g for full large-v3.
    mem_limit: 6g

    healthcheck:
      # /health reports 200 only once the model is loaded (same backend that
      # serves /v1/audio/transcriptions). Unauthenticated by design.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      # Generous: the first start downloads the model before it can report healthy.
      start_period: 600s

volumes:
  whisper-models:
